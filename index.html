<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4択クイズ</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* カスタムアニメーションや微調整用 */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 選択肢ボタンのホバーエフェクト */
        .choice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .choice-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- クイズコンテナ -->
    <div id="quiz-container" class="bg-white rounded-xl shadow-lg p-6 md:p-8 w-full max-w-lg fade-in">
        
        <!-- ヘッダー（進行状況） -->
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-blue-600">シンプルクイズ</h1>
            <span id="progress" class="text-sm font-semibold text-gray-500 bg-gray-100 py-1 px-3 rounded-full">Question 1 / 3</span>
        </div>

        <!-- 問題表示エリア -->
        <div id="question-area" class="mb-8">
            <h2 id="question-text" class="text-xl font-medium mb-4 leading-relaxed">問題文がここに入ります。</h2>
        </div>

        <!-- 選択肢エリア -->
        <div id="choices-area" class="space-y-3">
            <!-- ボタンはJavaScriptで動的に生成されます -->
        </div>

        <!-- フィードバックエリア（正解/不正解の表示） -->
        <div id="feedback-area" class="hidden mt-6 text-center">
            <p id="feedback-text" class="text-lg font-bold mb-4"></p>
            <button id="next-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-lg transition-colors duration-200 hidden">次の問題へ</button>
            <button id="restart-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-lg transition-colors duration-200 hidden">もう一度プレイ</button>
        </div>

        <!-- 結果表示エリア -->
        <div id="result-area" class="hidden text-center fade-in">
            <h2 class="text-3xl font-bold mb-4">結果発表</h2>
            <p id="score-text" class="text-xl mb-6"></p>
        </div>

    </div>

    <!-- JavaScript ロジック -->
    <script>
        // 問題データの配列 (質問, 選択肢の配列, 正解のインデックス)
        const quizData = [
            {
                question: "日本の首都はどこですか？",
                choices: ["大阪", "京都", "東京", "名古屋"],
                correctAnswer: 2 // "東京" (インデックスは0から始まるため)
            },
            {
                question: "次のうち、プログラミング言語ではないものはどれですか？",
                choices: ["Python", "HTML", "Java", "C++"],
                correctAnswer: 1 // "HTML" (マークアップ言語)
            },
            {
                question: "世界で一番高い山はどれですか？",
                choices: ["K2", "カンチェンジュンガ", "マカルー", "エベレスト"],
                correctAnswer: 3 // "エベレスト"
            },
            {
                question: "太陽系で一番大きい惑星はどれですか？",
                choices: ["地球", "木星", "土星", "火星"],
                correctAnswer: 1 // "木星"
            }
        ];

        // 現在の状態を保持する変数
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false; // 連打防止フラグ

        // DOM要素の取得
        const questionText = document.getElementById('question-text');
        const choicesArea = document.getElementById('choices-area');
        const progressText = document.getElementById('progress');
        const feedbackArea = document.getElementById('feedback-area');
        const feedbackText = document.getElementById('feedback-text');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const resultArea = document.getElementById('result-area');
        const scoreText = document.getElementById('score-text');

        // クイズを開始する関数
        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            resultArea.classList.add('hidden');
            questionText.parentElement.classList.remove('hidden');
            choicesArea.classList.remove('hidden');
            restartBtn.classList.add('hidden');
            loadQuestion();
        }

        // 問題を画面に表示する関数
        function loadQuestion() {
            isAnswered = false;
            feedbackArea.classList.add('hidden');
            nextBtn.classList.add('hidden');

            const currentQuiz = quizData[currentQuestionIndex];
            questionText.textContent = currentQuiz.question;
            progressText.textContent = `Question ${currentQuestionIndex + 1} / ${quizData.length}`;

            // 選択肢エリアをクリア
            choicesArea.innerHTML = '';

            // 選択肢ボタンを動的に生成
            currentQuiz.choices.forEach((choice, index) => {
                const button = document.createElement('button');
                button.textContent = choice;
                // Tailwindクラスを適用
                button.className = 'choice-btn w-full text-left bg-gray-50 border border-gray-200 hover:bg-blue-50 hover:border-blue-300 text-gray-700 font-medium py-3 px-4 rounded-lg transition-all duration-200 ease-in-out';
                
                // クリックイベントのリスナーを登録
                button.addEventListener('click', () => selectAnswer(index, button));
                
                choicesArea.appendChild(button);
            });
        }

        // 回答が選択された時の処理
        function selectAnswer(selectedIndex, selectedButton) {
            // すでに回答済みの場合は処理しない
            if (isAnswered) return;
            isAnswered = true;

            const currentQuiz = quizData[currentQuestionIndex];
            const isCorrect = selectedIndex === currentQuiz.correctAnswer;
            
            const allButtons = choicesArea.querySelectorAll('button');
            
            // 全ボタンを無効化し、正解・不正解のスタイルを適用
            allButtons.forEach((btn, index) => {
                btn.disabled = true; // ボタンを押せなくする
                btn.classList.remove('hover:bg-blue-50', 'hover:border-blue-300', 'choice-btn');
                
                if (index === currentQuiz.correctAnswer) {
                    // 正解のボタンは緑色に
                    btn.classList.add('bg-green-100', 'border-green-400', 'text-green-800');
                } else if (index === selectedIndex && !isCorrect) {
                    // 選択した不正解のボタンは赤色に
                    btn.classList.add('bg-red-100', 'border-red-400', 'text-red-800');
                } else {
                    // その他のボタンは少し薄く
                    btn.classList.add('opacity-50');
                }
            });

            // フィードバックの表示
            feedbackArea.classList.remove('hidden');
            if (isCorrect) {
                score++;
                feedbackText.textContent = "⭕️ 正解！";
                feedbackText.className = "text-2xl font-bold text-green-600 mb-4 fade-in";
            } else {
                feedbackText.textContent = "❌ 不正解...";
                feedbackText.className = "text-2xl font-bold text-red-600 mb-4 fade-in";
            }

            // 次の問題へ進むか、結果を表示するか判断
            if (currentQuestionIndex < quizData.length - 1) {
                nextBtn.classList.remove('hidden');
            } else {
                // 最後の問題が終わったら結果表示の準備
                setTimeout(showResult, 1500); // 1.5秒後に結果画面へ
            }
        }

        // 結果画面を表示する関数
        function showResult() {
            questionText.parentElement.classList.add('hidden');
            choicesArea.classList.add('hidden');
            feedbackArea.classList.add('hidden');
            
            resultArea.classList.remove('hidden');
            scoreText.innerHTML = `あなたのスコア: <br><span class="text-5xl font-bold text-blue-600 mt-2 inline-block">${score} / ${quizData.length}</span>`;
            
            // 結果画面にリスタートボタンを表示
            feedbackArea.classList.remove('hidden');
            feedbackText.textContent = "";
            restartBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');
        }

        // イベントリスナーの設定
        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            loadQuestion();
        });

        restartBtn.addEventListener('click', startQuiz);

        // 初期化実行
        startQuiz();

    </script>
</body>
</html>
