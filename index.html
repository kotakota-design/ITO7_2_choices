<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4択クイズ</title>
    <!-- 弱視・ディスレクシア配慮用 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // フォント設定の上書き
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: [
                            '"UD Digikyo Latin"',
                            '"UD Digi Kyokasho NK-R"',
                            '"UD Digi Kyokasho NP-R"',
                            '"UDデジタル教科書体 NP-R"',
                            '"Atkinson Hyperlegible"',
                            '"BIZ UDPGothic"',
                            'sans-serif'
                        ],
                    }
                }
            }
        }
    </script>
    <style>
        /* カスタムアニメーションや微調整用 */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 選択肢ボタンのホバーエフェクト */
        .choice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .choice-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4 lg:p-8">

    <!-- クイズコンテナ -->
    <div id="quiz-container" class="bg-white rounded-2xl shadow-xl p-6 md:p-8 lg:p-10 w-full max-w-6xl fade-in flex flex-col min-h-[70vh]">
        
        <!-- ヘッダー（進行状況） -->
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-600">英語文法クイズ</h1>
            <span id="progress" class="text-base md:text-lg font-semibold text-gray-600 bg-gray-100 py-1 px-4 rounded-full">Question 1 / 12</span>
        </div>

        <!-- クイズ本体エリア (iPad横・PC等で2カラム、スマホで1カラム) -->
        <div id="main-quiz-area" class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 flex-grow">
            
            <!-- 左カラム：問題表示エリア -->
            <div id="question-area" class="flex flex-col">
                <p id="question-id-text" class="text-base text-gray-500 font-mono mb-2"></p>
                <h2 id="question-text" class="text-2xl md:text-3xl lg:text-3xl font-bold mb-6 lg:mb-8 leading-snug tracking-wide text-gray-900">問題文がここに入ります。</h2>
                
                <!-- 和訳エリア (左カラムの下部に配置) -->
                <div class="mt-auto pt-6">
                    <p class="text-sm text-blue-600 font-bold mb-1">日本語訳</p>
                    <p id="translation-text" class="text-xl md:text-2xl text-gray-700 font-medium bg-blue-50 p-5 lg:p-6 rounded-xl border-l-4 border-blue-500 leading-relaxed shadow-sm">和訳がここに入ります。</p>
                </div>
            </div>

            <!-- 右カラム：選択肢＆フィードバックエリア -->
            <div class="flex flex-col justify-center">
                <!-- 選択肢エリア -->
                <div id="choices-area" class="space-y-4 lg:space-y-5">
                    <!-- ボタンはJavaScriptで動的に生成されます -->
                </div>

                <!-- フィードバックエリア（正解/不正解の表示・解説） -->
                <div id="feedback-area" class="hidden mt-6 text-center bg-gray-50 p-6 rounded-2xl border border-gray-200 fade-in shadow-inner">
                    <p id="feedback-text" class="text-3xl font-bold mb-4"></p>
                    <div id="explanation-text" class="text-left text-gray-800 text-lg md:text-xl mb-6 leading-relaxed p-5 bg-white rounded-xl border border-gray-200 shadow-sm">
                        <!-- 解説がここに入ります -->
                    </div>
                    <button id="next-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 text-xl rounded-xl transition-all duration-200 hidden mx-auto w-full shadow-md transform hover:-translate-y-1">次の問題へ</button>
                </div>
            </div>
        </div>

        <!-- 結果表示エリア -->
        <div id="result-area" class="hidden text-center fade-in flex flex-col items-center justify-center flex-grow py-10">
            <h2 class="text-4xl md:text-5xl font-bold mb-6 text-gray-800">結果発表</h2>
            <p id="score-text" class="text-2xl md:text-3xl mb-10 text-gray-600"></p>
            <button id="restart-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 md:py-5 px-10 text-2xl rounded-2xl transition-all duration-200 w-full max-w-md shadow-lg transform hover:-translate-y-1">もう一度プレイ</button>
        </div>

    </div>

    <!-- JavaScript ロジック -->
    <script>
        // 問題データの配列 (質問, 選択肢の配列, 正解のインデックス, 問題ID)
        // a問題、b問題の順になるように整理されています
        const originalQuizData = [
            {
                id: "2-1-a",
                question: "________ you ________ her before?",
                translation: "前に彼女に会ったことがありますか。",
                choices: ["Did / meet", "Have / met", "Do / meet", "Have / meeting"],
                correctAnswer: 1,
                explanation: "「前に〜したことがある」という経験を表す現在完了形（Have/Has ＋ 過去分詞）を使います。beforeがあるため、過去形（Did you meet）は使いません。"
            },
            {
                id: "2-1-b",
                question: "I ________ ________ her before.",
                translation: "私は前に彼女に会ったことがありません。",
                choices: ["didn't / meet", "don't / meet", "haven't / met", "haven't / meet"],
                correctAnswer: 2,
                explanation: "現在完了形の否定文は「have/has + not + 過去分詞」になります。動詞meetの過去分詞はmetです（原形のままにしてしまうミスに注意）。"
            },
            {
                id: "2-2-a",
                question: "When ________ he ________ the email?",
                translation: "彼がそのメールを受け取ったのはいつですか。",
                choices: ["has / received", "did / received", "did / receive", "does / receive"],
                correctAnswer: 2,
                explanation: "「いつ〜しましたか」と過去の一時点を尋ねるWhenの疑問文では、現在完了形は使えず【過去形】を使います。また、didを使った疑問文の後は【動詞の原形】（receive）に戻すのを忘れずに。"
            },
            {
                id: "2-2-b",
                question: "He ________ the email last night.",
                translation: "彼は昨夜，そのメールを受け取りました。",
                choices: ["has received", "received", "receives", "is receiving"],
                correctAnswer: 1,
                explanation: "文末に「last night（昨夜）」という明らかな過去を表す言葉があるため、現在完了形ではなく過去形を使います。現在完了形は特定の過去を表す語句とは一緒に使えません。"
            },
            {
                id: "2-3-a",
                question: "When ________ the singer ________ to Japan?",
                translation: "いつ，その歌手は日本にやって来ましたか。",
                choices: ["has / come", "did / came", "did / come", "does / come"],
                correctAnswer: 2,
                explanation: "こちらも「いつ」と過去の事実を尋ねるWhenの疑問文なので、現在完了形ではなく過去形（did + 原形）を使います。didの後はcameではなく原形のcomeになります。"
            },
            {
                id: "2-3-b",
                question: "The singer ________ ________ Japan two years ago.",
                translation: "その歌手は２年前に日本にやって来た。",
                choices: ["has come to", "came in", "came to", "comes to"],
                correctAnswer: 2,
                explanation: "「two years ago（2年前）」と過去の時点が明記されているので過去形を使います。「〜へ来る」は come to 〜 です。agoがあるのに現在完了形を選んでしまう引っかけに注意しましょう。"
            },
            {
                id: "2-4-a",
                question: "How long ________ she ________ him?",
                translation: "彼女は彼と知り合ってどのくらいになりますか。",
                choices: ["has / known", "have / known", "has / been knowing", "did / know"],
                correctAnswer: 0,
                explanation: "過去から現在までの期間を尋ねる「How long...?」は現在完了形と一緒に使われます。主語が she なので has を使います。また、know（知っている）は状態動詞なので、進行形（been knowing）にはできません。"
            },
            {
                id: "2-4-b",
                question: "She ________ ________ him ________ four years.",
                translation: "彼女は彼と知り合って４年になります。",
                choices: ["is knowing / for", "has known / for", "has known / since", "knew / for"],
                correctAnswer: 1,
                explanation: "「4年間ずっと（今も）」なので現在完了形の継続用法を使います。期間を表す場合は since（〜から）ではなく for（〜の間）を使います。"
            },
            {
                id: "2-5-a",
                question: "How long ________ you ________ on the team?",
                translation: "チームに入ってどのくらいになるのですか。",
                choices: ["have / been", "did / be", "are / being", "have / joined"],
                correctAnswer: 0,
                explanation: "チームに「（ずっと）所属している」という状態の継続を表すため、be動詞の過去分詞 been を使った現在完了形にします。join（参加する）という一瞬の動作を表す動詞は「ずっと〜している」という継続の意味では使えません。"
            },
            {
                id: "2-5-b",
                question: "I ________ ________ the team for three years.",
                translation: "チームに入って３年になります。",
                choices: ["have joined", "have been on", "am joining", "was in"],
                correctAnswer: 1,
                explanation: "前問と同様に「チームにいる（所属している）」状態の継続なので have been on を使います。have joined にしてしまうと「3年間入部という動作をし続けている」という不自然な意味になります。"
            },
            {
                id: "2-6-a",
                question: "What ________ they ________ this morning?",
                translation: "彼らは今朝から何をしているのですか。",
                choices: ["are / doing", "have / done", "have / been doing", "did / do"],
                correctAnswer: 2,
                explanation: "過去（今朝）から現在まで動作がずっと続いており、「（まさに今も）〜し続けている」ことを強調する場合は「現在完了進行形（have/has ＋ been ＋ 〜ing）」を使います。"
            },
            {
                id: "2-6-b",
                question: "They ________ tennis ________ this morning.",
                translation: "彼らは今朝からずっとテニスをしています。",
                choices: ["have played / for", "have been playing / since", "are playing / since", "played / from"],
                correctAnswer: 1,
                explanation: "「〜からずっと動作をし続けている」なので現在完了進行形（have been playing）を使います。出発点となる「〜から」を示すには、完了形では from ではなく since を用います。"
            }
        ];

        let quizData = []; // 出題用の配列
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;

        const mainQuizArea = document.getElementById('main-quiz-area');
        const questionIdText = document.getElementById('question-id-text');
        const questionText = document.getElementById('question-text');
        const translationText = document.getElementById('translation-text');
        const choicesArea = document.getElementById('choices-area');
        const progressText = document.getElementById('progress');
        const feedbackArea = document.getElementById('feedback-area');
        const feedbackText = document.getElementById('feedback-text');
        const explanationText = document.getElementById('explanation-text');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const resultArea = document.getElementById('result-area');
        const scoreText = document.getElementById('score-text');

        // シャッフル関数 (Fisher-Yatesアルゴリズム)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 小問ペアをシャッフルし、a→bの順序を保つ関数
        function prepareQuizData() {
            // 小問ごとにグループ化 (2-1, 2-2, ...)
            const groupedQuestions = {};
            originalQuizData.forEach(q => {
                // IDからプレフィックス（例："2-1"）とサフィックス（"a" or "b"）を抽出
                const parts = q.id.split('-');
                if (parts.length >= 3) {
                    const groupKey = `${parts[0]}-${parts[1]}`;
                    if (!groupedQuestions[groupKey]) {
                        groupedQuestions[groupKey] = [];
                    }
                    groupedQuestions[groupKey].push(q);
                }
            });

            // グループのキー（例: ["2-1", "2-2", "2-3", ...]）をシャッフル
            const groupKeys = Object.keys(groupedQuestions);
            shuffleArray(groupKeys);

            // シャッフルされたグループ順に、必ず 'a' -> 'b' の順で新しい配列に追加
            quizData = [];
            groupKeys.forEach(key => {
                const group = groupedQuestions[key];
                // 'a', 'b' でソートする
                group.sort((x, y) => {
                    const suffixX = x.id.split('-').pop();
                    const suffixY = y.id.split('-').pop();
                    return suffixX.localeCompare(suffixY);
                });
                
                // ソートされた問題（a→b）を出題用配列に追加
                quizData = quizData.concat(group);
            });
        }

        function startQuiz() {
            prepareQuizData(); // クイズ開始時にデータを準備・シャッフル
            currentQuestionIndex = 0;
            score = 0;
            resultArea.classList.add('hidden');
            mainQuizArea.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            feedbackArea.classList.add('hidden');
            nextBtn.classList.add('hidden');
            choicesArea.classList.remove('hidden');

            const currentQuiz = quizData[currentQuestionIndex];
            
            // 問題IDの表示（デバッグ・確認用）
            questionIdText.textContent = `ID: ${currentQuiz.id}`;
            questionText.textContent = currentQuiz.question;
            translationText.textContent = currentQuiz.translation;
            progressText.textContent = `Question ${currentQuestionIndex + 1} / ${quizData.length}`;

            choicesArea.innerHTML = '';

            // 選択肢の表示順もシャッフルする
            const shuffledChoices = currentQuiz.choices.map((choice, index) => {
                return { text: choice, originalIndex: index };
            });
            shuffleArray(shuffledChoices);

            shuffledChoices.forEach((choiceObj, index) => {
                const button = document.createElement('button');
                button.textContent = choiceObj.text;
                // タップ領域と文字を大きく設定
                button.className = 'choice-btn w-full text-left bg-white border-2 border-gray-200 hover:bg-blue-50 hover:border-blue-400 text-gray-800 font-bold py-5 px-6 text-xl md:text-2xl rounded-2xl transition-all duration-200 ease-in-out shadow-sm';
                
                // 選択されたボタンと、そのボタンが元々持っていたインデックスを渡す
                button.addEventListener('click', () => selectAnswer(choiceObj.originalIndex, button, shuffledChoices));
                
                choicesArea.appendChild(button);
            });
        }

        function selectAnswer(selectedOriginalIndex, selectedButton, shuffledChoices) {
            if (isAnswered) return;
            isAnswered = true;

            const currentQuiz = quizData[currentQuestionIndex];
            const isCorrect = selectedOriginalIndex === currentQuiz.correctAnswer;
            
            const allButtons = choicesArea.querySelectorAll('button');
            
            allButtons.forEach((btn, index) => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-blue-50', 'hover:border-blue-400', 'choice-btn');
                
                // 現在のボタンの元々のインデックスを取得
                const buttonOriginalIndex = shuffledChoices[index].originalIndex;

                if (buttonOriginalIndex === currentQuiz.correctAnswer) {
                    btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800', 'shadow-md');
                } else if (btn === selectedButton && !isCorrect) {
                    btn.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                } else {
                    btn.classList.add('opacity-50', 'bg-gray-50');
                }
            });

            feedbackArea.classList.remove('hidden');
            explanationText.innerHTML = `<span class="font-bold text-blue-600 block mb-2 text-xl md:text-2xl">【解説】</span>${currentQuiz.explanation}`;
            
            if (isCorrect) {
                score++;
                feedbackText.textContent = "⭕️ 正解！";
                feedbackText.className = "text-3xl font-bold text-green-600 mb-4 fade-in";
            } else {
                feedbackText.textContent = "❌ 不正解...";
                feedbackText.className = "text-3xl font-bold text-red-600 mb-4 fade-in";
            }

            if (currentQuestionIndex < quizData.length - 1) {
                nextBtn.classList.remove('hidden');
            } else {
                setTimeout(showResult, 1500);
            }
        }

        function showResult() {
            mainQuizArea.classList.add('hidden');
            
            resultArea.classList.remove('hidden');
            scoreText.innerHTML = `あなたのスコア: <br><span class="text-6xl lg:text-7xl font-extrabold text-blue-600 mt-6 inline-block drop-shadow-md">${score} / ${quizData.length}</span>`;
        }

        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            loadQuestion();
        });

        restartBtn.addEventListener('click', startQuiz);

        // 初期化実行
        startQuiz();

    </script>
</body>
</html>
